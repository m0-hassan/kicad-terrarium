[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-terrarium"
version = "0.2.0"
description = "Fast custom-symbol reuse and self-contained KiCad project handoffs."
readme = "README.md"
requires-python = ">= 3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mo Hassan", email = "mohassan@uchicago.edu" }]
keywords = ["kicad", "eda", "schematic", "library", "vendoring", "lint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.16,<1",
    "rich>=13,<16",
]

[project.urls]
Homepage = "https://github.com/m0-hassan/kicad-terrarium"
Repository = "https://github.com/m0-hassan/kicad-terrarium"
Issues = "https://github.com/m0-hassan/kicad-terrarium/issues"
Changelog = "https://github.com/m0-hassan/kicad-terrarium/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.11,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.15,<0.17",
    "twine>=6,<7",
]

[project.scripts]
kicad-terrarium = "kicad_terrarium.cli:app"
kt = "kicad_terrarium.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kicad_terrarium = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's design REQUIRES calling Argument()/Option() in parameter defaults,
# so tell bugbear (B008) these particular calls are safe there.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kicad_terrarium"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
