[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-terrarium"
version = "1.0.0"
description = "Make KiCad projects reproducibly self-contained."
readme = "README.md"
requires-python = ">= 3.10"
license = "MIT"
authors = [{ name = "Mo Hassan", email = "mohassan@uchicago.edu"}]
keywords = ["kicad", "eda", "schematic", "library", "vendoring", "lint"]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyfiglet>=1.0",
]

[project.urls]
Homepage = "https://github.com/m0-hassan/kicad-terrarium"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.0"]

[project.scripts]
kicad-terrarium = "kicad_terrarium.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's design REQUIRES calling Argument()/Option() in parameter defaults,
# so tell bugbear (B008) these particular calls are safe there.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.14"
