[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-terrarium"
version = "0.0.1"
description = "Make KiCad projects reproducibly self-contained."
requires-python = ">= 3.10"

[project.scripts]
kicad-terrarium = "kicad_terrarium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
